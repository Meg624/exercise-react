name: Strict Testing - React Form Components

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # ===============================================
      # 環境セットアップ
      # ===============================================
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      # スクリプトに実行権限を付与
      - name: Make scripts executable
        run: chmod +x .github/scripts/*.sh .github/scripts/*.js

      # ===============================================
      # 1. 必須ファイルの存在確認
      # ===============================================
      - name: Check required files
        run: ./.github/scripts/01-check-required-files.sh

      # ===============================================
      # 2. useFormフックの検証
      # ===============================================
      - name: Verify useForm hook implementation
        run: node .github/scripts/02-verify-useform-hook.js

      # ===============================================
      # 3. TypeScript型安全性チェック
      # ===============================================
      - name: TypeScript strict type checking
        run: |
          ./.github/scripts/03a-check-typescript.sh
          ./.github/scripts/03b-check-any-types.sh || true

      # ===============================================
      # 4. コンポーネント実装の検証
      # ===============================================
      - name: Verify component implementations
        run: node .github/scripts/04-verify-components.js

      # ===============================================
      # 5. アクセシビリティ実装の検証
      # ===============================================
      - name: Verify accessibility implementation
        run: node .github/scripts/05-verify-accessibility.js

      # ===============================================
      # 6. ビルドテスト
      # ===============================================
      - name: Build test
        run: ./.github/scripts/06-run-build.sh

      # ===============================================
      # 7. テスト実行とカバレッジ
      # ===============================================
      - name: Run tests with coverage
        run: node .github/scripts/07a-run-tests.js

      # ===============================================
      # 8. Lintチェック
      # ===============================================
      - name: Lint check
        run: ./.github/scripts/08-run-lint.sh

      # ===============================================
      # 9. 総合結果レポート生成
      # ===============================================
      - name: Generate test report
        if: always()
        run: |
          export JOB_STATUS="${{ job.status }}"
          node .github/scripts/09-generate-report.js

      # ===============================================
      # 10. PRへのコメント
      # ===============================================
      - name: Comment PR with test results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const prComment = require('./.github/scripts/10-pr-comment.js');
            await prComment(github, context);

      # ===============================================
      # 11. アーティファクトとして保存
      # ===============================================
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: |
            test-report.json
            test-report.md
          retention-days: 30

      # ===============================================
      # 12. テスト結果のサマリー表示
      # ===============================================
      - name: Display test summary
        if: always()
        run: |
          echo "=== テスト実行完了 ==="
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ すべてのテストに合格しました！"
          else
            echo "❌ 一部のテストが失敗しました"
            echo "詳細は上記のログを確認してください"
          fi
